<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Join a Dot Clash Challenge</title>
  <meta name="theme-color" content="#070b16" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Outfit:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="icon" href="/assets/images/dot-clash-icon.png" type="image/png" />
  <style>
    :root { color-scheme: dark; }
    body {
      font-family: "Outfit", system-ui, sans-serif;
      background:
        radial-gradient(ellipse 70% 45% at 50% 0%, rgba(45, 232, 255, 0.12), transparent 55%),
        #070b16;
      color: #eef2ff;
      margin: 0;
      min-height: 100vh;
      padding: 32px 20px;
      text-align: center;
      display: grid;
      place-items: center;
    }
    .panel { max-width: 420px; }
    img.icon {
      width: 4.5rem;
      height: 4.5rem;
      border-radius: 22%;
      margin-bottom: 1rem;
      box-shadow: 0 0 24px rgba(45, 232, 255, 0.25);
    }
    h1 {
      font-family: "Orbitron", sans-serif;
      font-size: 1.35rem;
      letter-spacing: 0.03em;
      margin: 0 0 0.75rem;
    }
    p { color: #9aa8c7; margin: 12px auto; line-height: 1.55; }
    a { color: #2de8ff; }
    code {
      color: #ff3db8;
      font-size: 0.95em;
    }
  </style>
</head>
<body>
  <div class="panel">
    <img class="icon" src="/assets/images/dot-clash-icon.png" width="1024" height="1024" alt="Dot Clash" />
    <h1>Join a challenge</h1>
    <p>Open Dot Clash and tap <strong>Challenge a Friend → Join</strong>, then enter the 6-character code your friend shared.</p>
    <p>Or open the full invite link they sent (e.g. <code>…/join/ABC123</code>).</p>
    <p><a href="/download/">Download Dot Clash</a></p>
  </div>
</body>
</html>
